version: '3.8'

# Override file for development environment
# This file is automatically merged with docker-compose.yml when running docker-compose

services:
  app:
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    ports:
      - "8080:8080"
      - "9229:9229"  # Debug port for Node.js inspector

  mongodb:
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=devadmin
      - MONGO_INITDB_ROOT_PASSWORD=devpassword
    volumes:
      - mongodb_data_dev:/data/db

  # Uncomment for Redis in development
  # redis:
  #   ports:
  #     - "6379:6379"

volumes:
  mongodb_data_dev: