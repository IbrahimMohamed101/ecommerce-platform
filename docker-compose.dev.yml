# Development environment with hot reloading and debugging

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecommerce-app-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9229:9229"  # Node.js debugger port
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/ecommerce
      - FRONTEND_URL=http://localhost:8080
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=dev-jwt-secret-key-for-development-only
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=30d
      - SESSION_SECRET=dev-session-secret-for-development-only
      - LOG_LEVEL=debug
      - EMAIL_ENABLED=false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce-dev
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7-jammy
    container_name: ecommerce-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=devadmin
      - MONGO_INITDB_ROOT_PASSWORD=devpassword
      - MONGO_INITDB_DATABASE=ecommerce
    volumes:
      - mongodb_data_dev:/data/db
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Redis for development caching
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    networks:
      - ecommerce-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data_dev:
  redis_data_dev:

networks:
  ecommerce-dev:
    driver: bridge